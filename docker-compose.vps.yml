services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skladpro-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8000
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Фронт с :5173 шлёт Origin http://IP:5173 — без порта в списке CORS preflight падает
      ORIGINS: ${APP_ORIGIN:-http://194.32.142.253,http://194.32.142.253:5173}
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://194.32.142.253/api/v1}
    container_name: skladpro-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    container_name: skladpro-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
