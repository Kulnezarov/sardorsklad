services:
  # PostgreSQL Database
  postgresql:
    image: postgres:15-alpine
    container_name: skladpro-postgresql
    environment:
      POSTGRES_USER: skladpro
      POSTGRES_PASSWORD: skladpro_password
      POSTGRES_DB: skladpro
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./supabase_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skladpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: skladpro-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skladpro-backend
    environment:
      DATABASE_URL: postgresql://skladpro:skladpro_password@postgresql:5432/skladpro
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ORIGINS: http://localhost:5173,http://localhost:3000,http://194.32.142.253,http://194.32.142.253:5173
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python main.py

  # React Frontend (production: Nginx + статика из `npm run build`)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://194.32.142.253:8000
    container_name: skladpro-frontend
    environment:
      VITE_API_URL: http://194.32.142.253:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgresql_data:
  redis_data:

networks:
  default:
    name: skladpro-network
